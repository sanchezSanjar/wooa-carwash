# nginx for the Wooa Carwash server: the website and the API, HTTPS only.
#
# 1. Replace wooa-carwash.com / api.wooa-carwash.com with your domains (both here and in the .env files).
# 2. Get certificates:  sudo certbot certonly --nginx -d wooa-carwash.com -d www.wooa-carwash.com -d api.wooa-carwash.com
# 3. Copy to /etc/nginx/sites-available/, link it into sites-enabled/, then: sudo nginx -t && sudo systemctl reload nginx
#
# backend/.env on the server:  NODE_ENV=production  TRUST_PROXY=1  CORS_ORIGINS=https://wooa-carwash.com,https://www.wooa-carwash.com
# app .env for builds:         EXPO_PUBLIC_API_URL=https://api.wooa-carwash.com  (wooa-carwash-app repo)
# The batch server listens on 127.0.0.1 only and is not published here.

# Plain http: only for certificate renewal, everything else moves to https
server {
    listen 80;
    listen [::]:80;
    server_name wooa-carwash.com www.wooa-carwash.com api.wooa-carwash.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# Shared TLS and security settings
map $scheme $hsts { https "max-age=31536000; includeSubDomains"; }

# API: proxied to the NestJS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.wooa-carwash.com;

    ssl_certificate     /etc/letsencrypt/live/wooa-carwash.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wooa-carwash.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security $hsts always;
    server_tokens off;

    # wash photos are up to 15 MB, Excel imports 2 MB
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # the API's rate limits use this (with TRUST_PROXY=1): set it, don't append what the client sent
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}

# Website: the exported Expo web app (in wooa-carwash-app: npx expo export -p web, then copy dist/ to /var/www/wooa-carwash)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wooa-carwash.com www.wooa-carwash.com;

    ssl_certificate     /etc/letsencrypt/live/wooa-carwash.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wooa-carwash.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    root /var/www/wooa-carwash;
    index index.html;
    server_tokens off;

    add_header Strict-Transport-Security $hsts always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # The login token is kept in the browser, so scripts from anywhere else must never run on this site.
    # Report-only first: check the browser console on every page, then rename the header to
    # Content-Security-Policy to enforce it.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.wooa-carwash.com; font-src 'self' data:; connect-src 'self' https://api.wooa-carwash.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # hashed bundles can be cached for a long time; index.html never.
    # (expires, not add_header: an add_header here would drop all the security headers above)
    location /_expo/ { expires 1y; }
    location = /index.html { expires -1; }

    # app routes (/plans, /account, ...) are handled by the app itself
    location / { try_files $uri $uri.html $uri/ /index.html; }
}
